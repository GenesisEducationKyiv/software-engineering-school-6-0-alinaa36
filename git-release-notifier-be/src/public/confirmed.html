<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Підписку підтверджено — Git Release Notifier</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0d1117;
        color: #e6edf3;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 40px;
        width: 100%;
        max-width: 440px;
        text-align: center;
      }

      .icon {
        font-size: 48px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 22px;
        font-weight: 600;
        color: #3fb950;
        margin-bottom: 12px;
      }

      .repo {
        display: inline-block;
        background: #1a2e1a;
        border: 1px solid #238636;
        color: #3fb950;
        font-family: monospace;
        font-size: 14px;
        padding: 4px 12px;
        border-radius: 6px;
        margin-bottom: 20px;
      }

      p {
        font-size: 14px;
        color: #8b949e;
        line-height: 1.6;
        margin-bottom: 32px;
      }

      a {
        display: inline-block;
        padding: 10px 24px;
        background: #238636;
        color: #fff;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s;
      }

      a:hover {
        background: #2ea043;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">&#10003;</div>
      <h1>Підписку підтверджено!</h1>
      <div class="repo" data-testid="repo-name">{{REPO}}</div>
      <p>
        Чудово! Тепер ти будеш отримувати email-сповіщення щоразу, коли у цьому репозиторії
        з'явиться новий реліз.
      </p>
      <a href="/">Підписатися ще</a>
    </div>
  </body>
</html>
