<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мої підписки — Git Release Notifier</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0d1117;
        color: #e6edf3;
        min-height: 100vh;
        padding: 40px 24px;
      }

      .container {
        max-width: 640px;
        margin: 0 auto;
      }

      .header {
        margin-bottom: 32px;
      }

      .header h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .header p {
        font-size: 14px;
        color: #8b949e;
      }

      .search-form {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .search-form input {
        flex: 1;
        min-width: 160px;
        padding: 9px 14px;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        color: #e6edf3;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s;
      }

      .search-form input::placeholder {
        color: #484f58;
      }

      .search-form input:focus {
        border-color: #58a6ff;
      }

      .search-form button {
        padding: 9px 20px;
        background: #238636;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s;
      }

      .search-form button:hover:not(:disabled) {
        background: #2ea043;
      }

      .search-form button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .message {
        padding: 12px 16px;
        border-radius: 6px;
        font-size: 14px;
        margin-bottom: 16px;
        display: none;
      }

      .message.error {
        background: #2d1219;
        border: 1px solid #f85149;
        color: #f85149;
        display: block;
      }

      .results-header {
        font-size: 13px;
        color: #8b949e;
        margin-bottom: 12px;
        display: none;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .item {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .item-repo {
        font-size: 14px;
        font-weight: 600;
        font-family: monospace;
        color: #58a6ff;
      }

      .item-meta {
        font-size: 12px;
        color: #8b949e;
        margin-top: 4px;
      }

      .badge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 12px;
        white-space: nowrap;
      }

      .badge.active {
        background: #1a2e1a;
        border: 1px solid #238636;
        color: #3fb950;
      }

      .badge.pending {
        background: #272115;
        border: 1px solid #9e6a03;
        color: #d29922;
      }

      .empty {
        text-align: center;
        padding: 48px 0;
        color: #8b949e;
        font-size: 14px;
        display: none;
      }

      .back {
        display: inline-block;
        margin-top: 32px;
        font-size: 13px;
        color: #58a6ff;
        text-decoration: none;
      }

      .back:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>&#128276; Мої підписки</h1>
        <p>Введіть email та API-ключ, щоб переглянути список підписок</p>
      </div>

      <form class="search-form" id="searchForm">
        <input type="email" id="email" placeholder="Email" aria-label="Email" required />
        <input type="password" id="apiKey" placeholder="API Key" aria-label="API Key" required />
        <button type="submit" id="searchBtn">Пошук</button>
      </form>

      <div class="message" id="message" data-testid="message"></div>

      <div class="results-header" id="resultsHeader" data-testid="resultsHeader"></div>

      <div class="list" id="list"></div>

      <div class="empty" id="empty" data-testid="empty">Підписок не знайдено</div>

      <a href="/" class="back">&#8592; Підписатися на репозиторій</a>
    </div>

    <script>
      document.getElementById('searchForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const btn = document.getElementById('searchBtn');
        const messageEl = document.getElementById('message');
        const listEl = document.getElementById('list');
        const emptyEl = document.getElementById('empty');
        const headerEl = document.getElementById('resultsHeader');
        const email = document.getElementById('email').value.trim();
        const apiKey = document.getElementById('apiKey').value.trim();

        btn.disabled = true;
        btn.textContent = 'Завантаження...';
        messageEl.className = 'message';
        messageEl.textContent = '';
        listEl.innerHTML = '';
        emptyEl.style.display = 'none';
        headerEl.style.display = 'none';

        try {
          const res = await fetch(`/api/subscriptions?email=${encodeURIComponent(email)}`, {
            headers: { 'x-api-key': apiKey },
          });

          const data = await res.json();

          if (!res.ok) {
            messageEl.className = 'message error';
            messageEl.textContent = data.error || 'Щось пішло не так.';
          } else {
            const subs = data.subscriptions ?? [];

            headerEl.style.display = 'block';
            headerEl.textContent = `Знайдено: ${subs.length} підписок для ${email}`;

            if (subs.length === 0) {
              emptyEl.style.display = 'block';
            } else {
              subs.forEach((sub) => {
                const date = new Date(sub.createdAt).toLocaleDateString('uk-UA');
                const tag = sub.lastSeenTag
                  ? `Останній тег: ${sub.lastSeenTag}`
                  : 'Тег ще не отримано';
                const badgeClass = sub.status === 'ACTIVE' ? 'active' : 'pending';
                const badgeLabel = sub.status === 'ACTIVE' ? 'Активна' : 'Очікує підтвердження';

                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                  <div>
                    <div class="item-repo" data-testid="item-repo">${sub.repository}</div>
                    <div class="item-meta">${tag} · Підписано ${date}</div>
                  </div>
                  <span class="badge ${badgeClass}" data-testid="badge-${badgeClass}">${badgeLabel}</span>
                `;
                listEl.appendChild(item);
              });
            }
          }
        } catch {
          messageEl.className = 'message error';
          messageEl.textContent = 'Не вдалося зʼєднатися з сервером.';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Пошук';
        }
      });
    </script>
  </body>
</html>
