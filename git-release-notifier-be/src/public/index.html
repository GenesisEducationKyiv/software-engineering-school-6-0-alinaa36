<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Release Notifier</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0d1117;
        color: #e6edf3;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 40px;
        width: 100%;
        max-width: 440px;
      }

      .logo {
        font-size: 28px;
        margin-bottom: 8px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        color: #e6edf3;
        margin-bottom: 4px;
      }

      .subtitle {
        font-size: 14px;
        color: #8b949e;
        margin-bottom: 32px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #e6edf3;
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 10px 14px;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        color: #e6edf3;
        font-size: 14px;
        margin-bottom: 20px;
        outline: none;
        transition: border-color 0.15s;
      }

      input::placeholder {
        color: #484f58;
      }

      input:focus {
        border-color: #58a6ff;
      }

      button {
        width: 100%;
        padding: 10px;
        background: #238636;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }

      button:hover:not(:disabled) {
        background: #2ea043;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .message {
        margin-top: 20px;
        padding: 12px 16px;
        border-radius: 6px;
        font-size: 14px;
        display: none;
      }

      .message.success {
        background: #1a2e1a;
        border: 1px solid #238636;
        color: #3fb950;
        display: block;
      }

      .message.error {
        background: #2d1219;
        border: 1px solid #f85149;
        color: #f85149;
        display: block;
      }

      .hint {
        font-size: 12px;
        color: #8b949e;
        margin-top: -14px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">&#128276;</div>
      <h1>Git Release Notifier</h1>
      <p class="subtitle">Отримуй email-сповіщення про нові релізи GitHub-репозиторіїв</p>

      <form id="subscribeForm">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          aria-label="Email"
          placeholder="you@example.com"
          required
        />

        <label for="repo">Репозиторій</label>
        <input
          type="text"
          id="repo"
          name="repo"
          aria-label="Репозиторій"
          placeholder="facebook/react"
          pattern="^[a-zA-Z0-9\-]+/[a-zA-Z0-9_.\-]+$"
          required
        />
        <p class="hint">Формат: owner/repository</p>

        <button type="submit" id="submitBtn">Підписатися</button>
      </form>

      <div class="message" id="message" data-testid="message"></div>
    </div>

    <a
      href="/subscriptions"
      style="display:block;text-align:center;margin-top:20px;font-size:13px;color:#58a6ff;text-decoration:none;"
    >
      Переглянути мої підписки &#8594;
    </a>

    <script>
      document.getElementById('subscribeForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        const messageEl = document.getElementById('message');
        const email = document.getElementById('email').value.trim();
        const repo = document.getElementById('repo').value.trim();

        btn.disabled = true;
        btn.textContent = 'Надсилаємо...';
        messageEl.className = 'message';
        messageEl.textContent = '';

        try {
          const res = await fetch('/api/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, repo }),
          });

          const data = await res.json();

          if (res.ok) {
            messageEl.className = 'message success';
            messageEl.textContent = data.message;
            e.target.reset();
          } else {
            messageEl.className = 'message error';
            messageEl.textContent = data.error || 'Щось пішло не так.';
          }
        } catch {
          messageEl.className = 'message error';
          messageEl.textContent = 'Не вдалося зʼєднатися з сервером.';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Підписатися';
        }
      });
    </script>
  </body>
</html>
